<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    >
    <title>SMH-Tree</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./renderer.js"></script>
  </head>
  <body>
    <main class="startup">
      <div class="mark" aria-hidden="true">SMH</div>
      <p class="eyebrow">LOCAL COGNITIVE WORKSPACE</p>
      <h1>SMH-Tree</h1>
      <p class="subtitle">A workspace for branching conversations and connected context.</p>
      <div class="connection" role="status" aria-live="polite">
        <span class="indicator" id="indicator"></span>
        <span id="status">Connecting to local backend…</span>
      </div>
      <p class="version" id="version"></p>
    </main>
  </body>
</html>
