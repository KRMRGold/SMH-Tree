name: Desktop CI

on:
  push:
    branches: [main, m8-desktop-shell]
    paths:
      - "desktop/**"
      - "backend/src/cogplat/__main__.py"
      - "backend/src/cogplat/main.py"
      - "backend/tests/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "backend/src/cogplat/__main__.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop Node tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --project ../backend --dev

      - name: Install desktop dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check main/main.js
          node --check main/backend-supervisor.js
          node --check main/sse-parser.js
          node --check preload/preload.js
          node --check renderer/renderer.js

      - name: Run desktop tests
        run: npm test
